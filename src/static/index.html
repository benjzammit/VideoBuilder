<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .drop-zone { transition: background-color 0.2s ease-in-out; }
        .drop-zone-over { background-color: #e0e7ff; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen p-4">
    <main class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600">Content Intelligence Platform</h1>
            <p class="text-gray-500 mt-2">Automate your video editing with the power of AI.</p>
        </header>

        <form id="edit-form" class="space-y-8">
            <section>
                <label class="block text-lg font-semibold mb-2 text-gray-800">1. Upload Your Video</label>
                <div id="drop-zone" class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-900/25 px-6 py-10">
                    <div class="text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M1.5 6a2.25 2.25 0 012.25-2.25h16.5A2.25 2.25 0 0122.5 6v12a2.25 2.25 0 01-2.25 2.25H3.75A2.25 2.25 0 011.5 18V6zM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0021 18v-1.94l-2.69-2.689a1.5 1.5 0 00-2.12 0l-.88.879.97.97a.75.75 0 11-1.06 1.06l-5.16-5.159a1.5 1.5 0 00-2.12 0L3 16.061zm10.125-7.81a1.125 1.125 0 112.25 0 1.125 1.125 0 01-2.25 0z" clip-rule="evenodd" />
                        </svg>
                        <div id="file-info" class="mt-4 flex text-sm leading-6 text-gray-600">
                            <label for="video-file" class="relative cursor-pointer rounded-md bg-white font-semibold text-indigo-600 focus-within:outline-none focus-within:ring-2 focus-within:ring-indigo-600 focus-within:ring-offset-2 hover:text-indigo-500">
                                <span>Upload a file</span>
                                <input id="video-file" name="file" type="file" class="sr-only" accept="video/mp4">
                            </label>
                            <p class="pl-1">or drag and drop</p>
                        </div>
                        <p class="text-xs leading-5 text-gray-600">MP4 up to 500MB</p>
                    </div>
                </div>
            </section>

            <section>
                <label for="prompt" class="block text-lg font-semibold mb-2 text-gray-800">2. Describe Your Desired Edit</label>
                <textarea id="prompt" name="prompt" rows="4" class="block w-full rounded-md border-0 p-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" placeholder="e.g., 'Create a fast-paced TikTok ad with a focus on the action shots.'"></textarea>
            </section>

            <div>
                <button type="submit" id="submit-button" class="w-full flex justify-center items-center gap-x-2 rounded-md bg-indigo-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:opacity-50" disabled>
                    Generate Video
                </button>
            </div>
        </form>

        <div id="status" class="mt-6" style="display: none;"></div>
    </main>

    <script>
        const form = document.getElementById('edit-form');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('video-file');
        const fileInfo = document.getElementById('file-info');
        const promptInput = document.getElementById('prompt');
        const submitButton = document.getElementById('submit-button');
        const statusDiv = document.getElementById('status');

        let selectedFile = null;

        function checkFormValidity() {
            submitButton.disabled = !(selectedFile && promptInput.value.trim() !== '');
        }

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drop-zone-over');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone-over');
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'video/mp4') {
                fileInput.files = files;
                handleFileSelection(files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleFileSelection(fileInput.files[0]);
            }
        });

        promptInput.addEventListener('input', checkFormValidity);

        function handleFileSelection(file) {
            selectedFile = file;
            fileInfo.innerHTML = `<p class="font-semibold text-indigo-600">${file.name}</p>`;
            checkFormValidity();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitButton.disabled = true;

            statusDiv.style.display = 'block';
            statusDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center p-4 rounded-lg bg-gray-50">
                    <div class="loader"></div>
                    <p class="mt-4 font-semibold text-lg">Processing your masterpiece...</p>
                    <p class="text-gray-500">Uploading video and consulting the AI. This may take a moment.</p>
                </div>`;

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('prompt', promptInput.value);

            try {
                const response = await fetch('/upload/', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Upload failed due to a server error.');
                }

                const result = await response.json();

                // Simulate backend processing
                setTimeout(() => {
                    statusDiv.innerHTML = `
                        <div class="p-4 rounded-lg bg-green-100 text-green-800 text-center">
                            <h3 class="font-bold text-lg">Video Generated!</h3>
                            <p class="mt-2">Your new video '${result.filename}' is ready.</p>
                            <a href="/fake/generated-video.mp4" target="_blank" class="inline-block mt-4 bg-green-600 text-white font-bold py-2 px-4 rounded hover:bg-green-700">
                                View & Share
                            </a>
                        </div>`;
                    submitButton.disabled = false;
                }, 5000);

            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="p-4 rounded-lg bg-red-100 text-red-800 text-center">
                        <h3 class="font-bold">An Error Occurred</h3>
                        <p>${error.message}</p>
                    </div>`;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
