<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .drop-zone { transition: background-color 0.2s ease-in-out; }
        .drop-zone-over { background-color: #e0e7ff; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <main class="container mx-auto p-4 md:p-8 max-w-7xl">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-indigo-600">Content Intelligence Platform</h1>
            <p class="text-gray-500 mt-2 text-lg">Your AI-powered video editing assistant.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Upload Section -->
            <section class="bg-white p-8 rounded-2xl shadow-xl">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">1. Add Video to Library</h2>
                <p class="text-gray-500 mb-6">Upload a video to make its content available for future edits.</p>
                <form id="upload-form" class="space-y-6">
                    <div id="upload-drop-zone" class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-900/25 px-6 py-10">
                        <div class="text-center">
                            <svg class="mx-auto h-12 w-12 text-gray-400" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M1.5 6a2.25 2.25 0 012.25-2.25h16.5A2.25 2.25 0 0122.5 6v12a2.25 2.25 0 01-2.25 2.25H3.75A2.25 2.25 0 011.5 18V6zM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0021 18v-1.94l-2.69-2.689a1.5 1.5 0 00-2.12 0l-.88.879.97.97a.75.75 0 11-1.06 1.06l-5.16-5.159a1.5 1.5 0 00-2.12 0L3 16.061zm10.125-7.81a1.125 1.125 0 112.25 0 1.125 1.125 0 01-2.25 0z" clip-rule="evenodd" /></svg>
                            <div id="upload-file-info" class="mt-4 flex text-sm leading-6 text-gray-600"><label for="video-file" class="relative cursor-pointer rounded-md bg-white font-semibold text-indigo-600 focus-within:outline-none focus-within:ring-2 focus-within:ring-indigo-600 focus-within:ring-offset-2 hover:text-indigo-500"><span>Upload a file</span><input id="video-file" name="file" type="file" class="sr-only" accept="video/mp4"></label><p class="pl-1">or drag and drop</p></div>
                            <p class="text-xs leading-5 text-gray-600">MP4 up to 500MB</p>
                        </div>
                    </div>
                    <button type="submit" id="upload-button" class="w-full flex justify-center items-center gap-x-2 rounded-md bg-indigo-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 disabled:opacity-50" disabled>Upload Video</button>
                </form>
                <div id="upload-status-container" class="mt-6" style="display: none;"></div>
            </section>

            <!-- Create Section -->
            <section class="bg-white p-8 rounded-2xl shadow-xl">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">2. Create New Video from Library</h2>
                <p class="text-gray-500 mb-6">Use a prompt to generate a new video using all available footage.</p>
                <form id="create-form" class="space-y-6">
                    <textarea id="prompt" name="prompt" rows="8" class="block w-full rounded-md border-0 p-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" placeholder="e.g., 'Create a fast-paced TikTok ad with a focus on the action shots.'"></textarea>
                    <button type="submit" id="create-button" class="w-full flex justify-center items-center gap-x-2 rounded-md bg-green-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-green-500 disabled:opacity-50" disabled>Generate Video</button>
                </form>
                <div id="create-status-container" class="mt-6" style="display: none;"></div>
            </section>
        </div>
    </main>

    <script>
        // --- Generic Helper Functions ---
        let pollingIntervals = {};
        function setStatus(container, html) {
            container.style.display = 'block';
            container.innerHTML = html;
        }
        function pollStatus(taskId, container, onComplete) {
            if (pollingIntervals[taskId]) clearInterval(pollingIntervals[taskId]);
            pollingIntervals[taskId] = setInterval(async () => {
                try {
                    const response = await fetch(`/status/${taskId}`);
                    if (!response.ok) throw new Error(`Status check failed`);
                    const data = await response.json();
                    const statusMsg = data.status ? data.status.charAt(0).toUpperCase() + data.status.slice(1) : 'Unknown';
                    setStatus(container, `<div class="flex items-center gap-4 text-center p-4 rounded-lg bg-gray-50"><div class="loader"></div><div><p class="font-semibold text-lg text-left">Status: ${statusMsg}</p><p class="text-gray-500 text-left">Working on your request...</p></div></div>`);
                    if (data.status === 'complete' || data.status === 'failed') {
                        clearInterval(pollingIntervals[taskId]);
                        onComplete(data);
                    }
                } catch (error) {
                    console.error("Polling error:", error);
                    clearInterval(pollingIntervals[taskId]);
                    setStatus(container, `<div class="p-4 rounded-lg bg-red-100 text-red-800 text-center"><h3 class="font-bold">Connection Error</h3><p>Could not get status from the server.</p></div>`);
                }
            }, 5000);
        }

        // --- Upload Logic ---
        const uploadForm = document.getElementById('upload-form');
        const uploadDropZone = document.getElementById('upload-drop-zone');
        const uploadFileInput = document.getElementById('video-file');
        const uploadFileInfo = document.getElementById('upload-file-info');
        const uploadButton = document.getElementById('upload-button');
        const uploadStatusContainer = document.getElementById('upload-status-container');
        let uploadFile = null;

        uploadButton.disabled = true;
        uploadDropZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadDropZone.classList.add('drop-zone-over'); });
        uploadDropZone.addEventListener('dragleave', (e) => { e.preventDefault(); uploadDropZone.classList.remove('drop-zone-over'); });
        uploadDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadDropZone.classList.remove('drop-zone-over');
            if (e.dataTransfer.files.length > 0) {
                uploadFileInput.files = e.dataTransfer.files;
                handleUploadFileSelection(e.dataTransfer.files[0]);
            }
        });
        uploadFileInput.addEventListener('change', () => { if (uploadFileInput.files.length > 0) handleUploadFileSelection(uploadFileInput.files[0]); });

        function handleUploadFileSelection(file) {
            if (file.type === 'video/mp4') {
                uploadFile = file;
                uploadFileInfo.innerHTML = `<p class="font-semibold text-indigo-600">${file.name}</p>`;
                uploadButton.disabled = false;
            } else {
                uploadFile = null;
                uploadFileInfo.innerHTML = `<p class="font-semibold text-red-600">Please select an MP4 file.</p>`;
                uploadButton.disabled = true;
            }
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            uploadButton.disabled = true;
            setStatus(uploadStatusContainer, `<div class="flex items-center gap-4 text-center p-4 rounded-lg bg-gray-50"><div class="loader"></div><p class="font-semibold text-lg">Uploading...</p></div>`);
            const formData = new FormData();
            formData.append('file', uploadFile);
            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Upload failed');
                }
                const result = await response.json();
                pollStatus(result.task_id, uploadStatusContainer, (data) => {
                    if (data.status === 'complete') {
                        setStatus(uploadStatusContainer, `<div class="p-4 rounded-lg bg-green-100 text-green-800 text-center"><h3 class="font-bold">Analysis Complete</h3><p>Video has been added to your library.</p></div>`);
                    } else {
                        setStatus(uploadStatusContainer, `<div class="p-4 rounded-lg bg-red-100 text-red-800 text-center"><h3 class="font-bold">Analysis Failed</h3><p>${data.error_message || 'An unknown error occurred.'}</p></div>`);
                    }
                    uploadButton.disabled = false;
                });
            } catch (error) {
                setStatus(uploadStatusContainer, `<div class="p-4 rounded-lg bg-red-100 text-red-800 text-center"><h3 class="font-bold">Upload Error</h3><p>${error.message}</p></div>`);
                uploadButton.disabled = false;
            }
        });

        // --- Create Logic ---
        const createForm = document.getElementById('create-form');
        const promptInput = document.getElementById('prompt');
        const createButton = document.getElementById('create-button');
        const createStatusContainer = document.getElementById('create-status-container');

        createButton.disabled = true;
        promptInput.addEventListener('input', () => { createButton.disabled = promptInput.value.trim() === ''; });

        createForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            createButton.disabled = true;
            setStatus(createStatusContainer, `<div class="flex items-center gap-4 text-center p-4 rounded-lg bg-gray-50"><div class="loader"></div><p class="font-semibold text-lg">Starting job...</p></div>`);
            try {
                const response = await fetch('/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({prompt: promptInput.value}) });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to start creation job.');
                }
                const result = await response.json();
                pollStatus(result.task_id, createStatusContainer, (data) => {
                    if (data.status === 'complete') {
                        setStatus(createStatusContainer, `<div class="p-4 rounded-lg bg-green-100 text-green-800 text-center"><h3 class="font-bold">Video Generated!</h3><a href="${data.final_url}" target="_blank" class="inline-block mt-4 bg-green-600 text-white font-bold py-2 px-4 rounded hover:bg-green-700">View & Share Your Video</a></div>`);
                    } else {
                        setStatus(createStatusContainer, `<div class="p-4 rounded-lg bg-red-100 text-red-800 text-center"><h3 class="font-bold">Creation Failed</h3><p>${data.error_message || 'An unknown error occurred.'}</p></div>`);
                    }
                    createButton.disabled = false;
                });
            } catch (error) {
                setStatus(createStatusContainer, `<div class="p-4 rounded-lg bg-red-100 text-red-800 text-center"><h3 class="font-bold">Error</h3><p>${error.message}</p></div>`);
                createButton.disabled = false;
            }
        });
    </script>
</body>
</html>
